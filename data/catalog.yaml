# Rendu en paragraphe justifié (les puces sont recollées) pour rester identique
# au CV actuel.
projet_academique:
  - id: jeu_video_ia
    titre: "Jeu Vidéo IA en C – Agent Reinforcement Learning (SDL2)"
    dates: "Juin 2026"
    tags: [reinforcement-learning, c, sdl2, from-scratch]
    bullets:
      - "Projet de fin d'année : développement d'un moteur de jeu en C (SDL2) intégrant un agent entraîné par policy gradient (algorithme REINFORCE)."
      - "Implémentation from scratch du pipeline d'entraînement : extraction de features d'état, politique softmax paramétrée et mise à jour des poids par descente de gradient, avec gestion bas-niveau de la mémoire."
    bullets_defaut: [0, 1]

projets:
  - id: agent_mcp
    titre: "Agent IA Connecté – Protocole MCP"
    dates: "Août 2026 - En cours"
    tags: [llm, agent, mcp, langchain, sql, python, api]
    bullets:
      - "Agent conversationnel Python connecté via le protocole MCP à des sources hétérogènes (SaaS)."
      - "Traduction du langage naturel en appels d'outils structurés et génération automatisée de rapports d'insights."
      - "Développement d'un serveur MCP exposant schémas de données et permissions d'accès."
      # Variante longue (formulation déjà utilisée par Marcel), remplace la puce 0.
      - "Agent conversationnel Python (LangChain) connecté via le protocole MCP à des sources hétérogènes (SQL, SaaS CRM/support)."
    bullets_defaut: [0, 1, 2]

  - id: n8n_candidatures
    titre: "Automatisation Intelligente de Candidatures (n8n)"
    dates: "Juillet 2026"
    tags: [etl, automatisation, n8n, llm, gemini, api, google-sheets, docker, reporting]
    bullets:
      - "Pipeline d'automatisation sous n8n (self-hosted) : ingestion d'offres (via API), normalisation, stockage et scoring de pertinence."
      - "Génération de contenus personnalisés via LLM ; intégration Gmail API, logs d'audit et gestion d'erreurs."
      # Puces 2-4 : même projet, angle data engineering / reporting.
      - "Pipeline ETL end-to-end orchestré sous n8n (self-hosted) : ingestion via API, normalisation, déduplication et persistance structurée (Google Sheets API), puis scoring automatisé de pertinence."
      - "Intégration d'une API LLM (Gemini) pour l'enrichissement sémantique des données, avec logs d'audit, gestion d'erreurs et reporting automatisé des indicateurs de suivi."
      - "Ingestion des offres via l'API Apify, persistance via Google Sheets API et génération de contenus via Gemini Flash-Lite (prompt engineering), le tout conteneurisé sous Docker."
    bullets_defaut: [0, 1]

  - id: bike_fit
    titre: "Bike Fit – Analyse Posturale par Computer Vision (Freelance)"
    dates: "Juin 2026 - En cours"
    tags: [computer-vision, opencv, mediapipe, llm, gemini, python, freelance, b2b]
    bullets:
      - "Logiciel Python modulaire : pipeline de pose (MediaPipe, OpenCV), extraction de landmarks et calcul d'angles articulaires, recommandations via LLM (Gemini) et rapports PDF."
      - "En test auprès de vélocistes professionnels."
      - "Interface desktop CustomTkinter."
      - "Cas d'usage B2B identifié."
    bullets_defaut: [0, 1]

  - id: segmentation_acp
    titre: "Segmentation par ACP & Prévision de Distribution"
    dates: "Février 2026 - Avril 2026"
    tags: [acp, clustering, forecasting, power-bi, sql, python, retail]
    bullets:
      - "Pipeline Python/SQL d'analyse produit : traitement des ventes, réduction dimensionnelle (ACP) et clustering hiérarchique (CAH) pour segmenter les points de vente."
      - "Modélisation de prévisions à 3 mois et création d'un dashboard Power BI mesurant l'écart assortiment théorique vs distribution réelle."
    bullets_defaut: [0, 1]

  - id: backtesting_quant
    titre: "Backtesting Quantitatif – Validation Statistique de Stratégies"
    dates: "Août 2025 - Décembre 2025"
    tags: [series-temporelles, finance, pandas, numpy, backtrader, statistiques]
    bullets:
      - "Création d'un framework de backtesting (Pandas, NumPy, Backtrader) : traitement des données, stratégies momentum/mean-reversion, et validation walk-forward."
      - "Évaluation de la robustesse et des risques (ratio de Sharpe, max drawdown) via tests statistiques."
    bullets_defaut: [0, 1]

  - id: rag_conformite
    titre: "Pipeline RAG – Contrôle de Conformité Réglementaire"
    dates: "Mai 2025 - Juillet 2025"
    tags: [rag, llm, pgvector, postgresql, fastapi, nlp, conformite]
    bullets:
      - "Pipeline RAG en Python pour l'analyse automatisée de documents réglementaires : chunking sémantique, indexation vectorielle (PostgreSQL/pgvector) et inférence LLM."
      - "Détection d'anomalies avec justification par extraits sourcés pour garantir la traçabilité."
      - "Résultats exposés via API REST (FastAPI), évaluation de la pertinence du retrieval."
      - "Structuration de corpus hétérogènes pour le contrôle automatisé de documents réglementaires."
    bullets_defaut: [0, 1, 2]

