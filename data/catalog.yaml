# Rendu en paragraphe justifié (les puces sont recollées) pour rester identique
# au CV actuel.
projet_academique:
  - id: jeu_video_ia
    titre: "Jeu Vidéo IA en C – Agent Reinforcement Learning (SDL2) – ~50 heures"
    dates: "Juin 2026"
    tags: [reinforcement-learning, c, sdl2, from-scratch]
    bullets:
      - "Développement d'un moteur de jeu en C (SDL2) intégrant un agent entraîné par policy gradient (algorithme REINFORCE)."
      - "Implémentation from scratch du pipeline d'entraînement : extraction de features d'état, politique softmax paramétrée et mise à jour des poids par descente de gradient, avec gestion bas-niveau de la mémoire."
    bullets_defaut: [0, 1]

# Puces : UNE LIGNE chacune (<= 100 caractères, vérifié par les tests).
# Le projet freelance Bike Fit figure dans `experiences`, pas ici.
projets:
  - id: agent_mcp
    titre: "Agent IA Connecté – Protocole MCP"
    dates: "Août 2026 - En cours"
    tags: [llm, agent, mcp, langchain, sql, python, api]
    bullets:
      - "Agent Python (LangChain) relié via MCP à des sources hétérogènes (SQL, SaaS CRM/support)."
      - "Traduction du langage naturel en appels d'outils et génération automatisée de rapports d'insights."
      - "Serveur MCP exposant schémas de données et permissions d'accès."
    bullets_defaut: [0, 1, 2]

  - id: n8n_candidatures
    titre: "Automatisation Intelligente de Candidatures (n8n)"
    dates: "Juillet 2026"
    tags: [etl, automatisation, n8n, llm, gemini, api, google-sheets, docker, reporting]
    bullets:
      - "Pipeline ETL n8n self-hosted : ingestion d'offres via API Apify, normalisation, scoring."
      - "Contenus personnalisés via LLM (Gemini Flash-Lite), intégration Gmail API, logs d'audit, Docker."
      - "Déduplication, persistance Google Sheets API et reporting automatisé des indicateurs de suivi."
    bullets_defaut: [0, 1]

  - id: segmentation_acp
    titre: "Segmentation par ACP & Prévision de Distribution"
    dates: "Février 2026 - Avril 2026"
    tags: [acp, clustering, forecasting, power-bi, sql, python, retail]
    bullets:
      - "Pipeline Python/SQL : ACP et clustering hiérarchique (CAH) pour segmenter les points de vente."
      - "Prévisions à 3 mois et dashboard Power BI : assortiment théorique vs distribution réelle."
    bullets_defaut: [0, 1]

  - id: backtesting_quant
    titre: "Backtesting Quantitatif – Validation Statistique de Stratégies"
    dates: "Août 2025 - Décembre 2025"
    tags: [series-temporelles, finance, pandas, numpy, backtrader, statistiques]
    bullets:
      - "Framework de backtesting (Pandas, NumPy, Backtrader) : momentum, mean-reversion, walk-forward."
      - "Robustesse et risques évalués par tests statistiques (ratio de Sharpe, max drawdown)."
    bullets_defaut: [0, 1]

  - id: rag_conformite
    titre: "Pipeline RAG – Contrôle de Conformité Réglementaire"
    dates: "Mai 2025 - Juillet 2025"
    tags: [rag, llm, pgvector, postgresql, fastapi, nlp, conformite]
    bullets:
      - "Pipeline RAG Python : chunking sémantique, indexation pgvector (PostgreSQL) et inférence LLM."
      - "Détection d'anomalies réglementaires avec justification par extraits sourcés."
      - "Résultats exposés via API REST (FastAPI), évaluation de la pertinence du retrieval."
    bullets_defaut: [0, 1, 2]

  - id: connectome_drosophile
    titre: "Simulation du Cerveau de la Drosophile – Connectome & SNN"
    dates: "Octobre 2026"
    tags: [simulation, spiking-neural-network, graphe, brian2, ml, scikit-learn, pandas, python, neurosciences]
    bullets:
      - "Simulation du cerveau de la drosophile (connectome FlyWire, ~139 000 neurones) sous Brian2."
      - "Pipeline Python : graphe synaptique pondéré, expériences d'activation/inhibition de neurones."
      - "Classifieur Scikit-Learn du type cellulaire à partir de features du graphe, validation croisée."
    bullets_defaut: [0, 1, 2]

