# Catalogue unique de Marcel Yeo — SOURCE DE VÉRITÉ.
#
# Règle : rien n'est généré qui ne figure pas ici. Le LLM sélectionne et ordonne
# des identifiants ; il n'invente ni compétence, ni projet, ni chiffre.
